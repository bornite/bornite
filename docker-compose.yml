services:
  db:
    image: postgres:16-alpine
    container_name: bornite-db
    environment:
      POSTGRES_USER: bornite
      POSTGRES_PASSWORD: bornite
      POSTGRES_DB: bornite
    ports:
      - "5432:5432"
    volumes:
      - bornite-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bornite -d bornite"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bornite-db-data:
